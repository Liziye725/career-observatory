<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行与改进账本 · 职业观察</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172c2b;background:#f4f7f5;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#183d38;color:white;padding:2rem max(1.2rem,calc((100vw - 1160px)/2));}header a{color:#ddebab}h1{font-size:2rem;margin:.8rem 0}header p{line-height:1.7;max-width:50rem;color:#d5e5de}main{max-width:1200px;margin:auto;padding:1.4rem}button,select,textarea,input{font:inherit}button,.button{cursor:pointer;background:#183d38;color:white;border:0;border-radius:.5rem;padding:.7rem 1rem;text-decoration:none}button:disabled{opacity:.6;cursor:wait}select,input,textarea{border:1px solid #a7bdb5;background:white;color:#172c2b;border-radius:.4rem;padding:.65rem;width:100%}textarea{min-height:8rem;resize:vertical}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#183d38 50%),linear-gradient(135deg,#183d38 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:2rem}.toolbar{display:flex;gap:1rem;align-items:end;flex-wrap:wrap}.toolbar label{flex:1;min-width:10rem}label{display:block;margin-bottom:1rem;font-size:.9rem;font-weight:600}label>*{margin-top:.5rem}.stats{margin:1.2rem 0;line-height:1.8}.layout{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}.card,.panel{background:white;border:1px solid #d7e2dc;border-radius:.7rem;padding:1.25rem;margin-bottom:1rem}.card h2{font-size:1.15rem}.meta{font-size:.9rem;color:#4e6860}.badge{display:inline-block;padding:.2rem .55rem;background:#e5edda;border-radius:.3rem;margin-right:.5rem}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-family:inherit;font-size:1rem}.feedback{border-top:2px solid #d7e2dc;margin-top:2rem;padding-top:1rem}.error{color:#942e2e}a{color:#185d4b}#detail{min-width:0}details{margin:1rem 0}summary{cursor:pointer;font-weight:600}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7f992e;outline-offset:3px}@media(max-width:760px){.layout{grid-template-columns:1fr}h1{font-size:1.6rem}}
</style></head><body><header><a href="/">职业观察首页</a><h1>运行与改进账本</h1><p>从每次尝试中积累。按项目追踪未解决问题、重复失败的方法、改进效果，以及我们讨论后的决定。</p></header><main><div class="toolbar"><label>项目<select id="project"><option value="">全部项目</option></select></label><label>记录类型<select id="kind"><option value="">全部类型</option><option value="problem">问题与失败</option><option value="improvement">改进实验</option><option value="feedback">我的反馈</option><option value="run">运行记录</option><option value="batch">研究批次</option></select></label><label>状态<select id="status"><option value="">全部状态</option><option value="open">未解决</option><option value="blocked">受阻</option><option value="in_progress">进行中</option><option value="partial">待补全</option><option value="testing">验证中</option><option value="validated">已验证</option><option value="resolved">已解决</option><option value="recorded">已记录</option><option value="applied">已采用</option><option value="complete">已完成</option></select></label><button id="refresh">刷新</button><a class="button" id="export" href="/api/ledger/export.md">导出 Markdown</a></div><div class="stats" id="stats" role="status"></div><div class="layout"><section id="list" aria-label="记录列表"></section><section id="detail" class="panel" aria-label="记录详情"><p>选择一条记录，查看历次尝试与反馈。</p></section></div><section class="panel feedback"><h2>留下反馈</h2><p>反馈会保存到私人账本，下次任务会读取。你可以关联当前记录，也可以提出新的方向。</p><form id="feedback"><label>所属项目<select id="feedbackProject"></select></label><label>反馈主题<input id="feedbackTitle" maxlength="180" required></label><label>你的意见或决定<textarea id="feedbackText" maxlength="20000" required></textarea></label><button id="saveFeedback" type="submit">保存反馈</button><p id="feedbackStatus" role="status"></p></form></section></main><script>
const $=id=>document.getElementById(id),escapeText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={run:'运行',problem:'问题',improvement:'改进',feedback:'反馈',batch:'批次',open:'未解决',blocked:'受阻',in_progress:'进行中',resolved:'已解决',proposed:'待尝试',testing:'验证中',validated:'已验证',rejected:'已否决',recorded:'已记录',applied:'已采用',partial:'待补全',complete:'已完成',failed:'失败',assistant:'助手',user:'你'};
let projects={},selected=null,loadVersion=0,detailVersion=0;
async function api(url,options){const r=await fetch(url,options);const value=await r.json();if(!r.ok)throw Error(value.error||'请求失败');return value;}
async function load(){const v=++loadVersion;const q=new URLSearchParams();for(const k of ['project','kind','status'])if($(k).value)q.set(k,$(k).value);$('stats').textContent='正在读取私人账本…';try{const data=await api('/api/ledger?'+q);if(v!==loadVersion)return;projects=data.projects;if($('project').options.length===1){for(const [id,name]of Object.entries(projects)){for(const elem of [$('project'),$('feedbackProject')])elem.add(new Option(name,id));}}$('export').href='/api/ledger/export.md'+($('project').value?'?project='+encodeURIComponent($('project').value):'');$('stats').textContent=`当前显示 ${data.items.length} 个事项 · 所选项目/类型共 ${data.totalEvents} 条历史记录 · 未记录不代表未运行`;$('list').innerHTML=data.items.map(e=>`<article class="card"><div class="meta">${escapeText(projects[e.project])} · ${escapeText(names[e.kind])}</div><h2>${escapeText(e.title)}</h2><span class="badge">${escapeText(names[e.status])}</span><span class="meta">${e.eventCount} 条历史</span><p>${escapeText(e.summary)}</p><p class="meta">${escapeText(e.createdAt)}</p><button data-event="${escapeText(e.id)}">查看历史与下一步</button></article>`).join('')||'<p class="panel">暂无匹配记录。后续运行会持续追加。</p>';}catch(e){if(v===loadVersion)$('stats').textContent=e.message;}}
async function detail(id){const v=++detailVersion;$('detail').textContent='正在读取历史…';try{const event=await api('/api/ledger/events/'+encodeURIComponent(id));const history=await api('/api/ledger?'+new URLSearchParams({project:event.project,subject:event.subject}));if(v!==detailVersion)return;selected=event;$('feedbackProject').value=event.project;const records=await Promise.all(history.events.map(e=>api('/api/ledger/events/'+encodeURIComponent(e.id))));if(v!==detailVersion)return;$('detail').innerHTML='<h2>'+escapeText(event.title)+'</h2><p class="meta">同一事项持续追加，旧记录保留。</p>'+records.reverse().map((e,i)=>`<details ${i===0?'open':''}><summary>${escapeText(names[e.status])} · ${escapeText(e.createdAt)}</summary><p class="meta">记录者：${escapeText(names[e.author])}</p><div class="text">${escapeText(e.markdown)}</div>${Object.keys(e.metrics).length?'<p class="meta">度量：'+escapeText(JSON.stringify(e.metrics))+'</p>':''}</details>`).join('');}catch(e){if(v===detailVersion)$('detail').textContent=e.message;}}
$('list').onclick=e=>{const b=e.target.closest('[data-event]');if(b)detail(b.dataset.event);};for(const k of ['project','kind','status'])$(k).onchange=load;$('refresh').onclick=load;
$('feedback').onsubmit=async e=>{e.preventDefault();const button=$('saveFeedback');button.disabled=true;const id='feedback-'+crypto.randomUUID();const project=$('feedbackProject').value;const same=selected?.project===project;const content=$('feedbackText').value.trim();if(!content){button.disabled=false;return;}const body={id,project,kind:'feedback',subject:same?selected.subject:id,status:'recorded',author:'user',title:$('feedbackTitle').value.trim(),summary:content.slice(0,1200),markdown:content,relatedRun:same?(selected.kind==='run'?selected.subject:selected.relatedRun):null,observedAt:new Date().toISOString(),metrics:{}};try{await api('/api/ledger/events/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const saved=await api('/api/ledger/events/'+id);if(saved.markdown!==content)throw Error('保存读回不一致，请刷新核对');$('feedbackStatus').textContent='反馈已保存并核对。';$('feedbackTitle').value='';$('feedbackText').value='';await load();}catch(e){$('feedbackStatus').textContent=e.message;}finally{button.disabled=false;}};
load();
</script></body></html>
