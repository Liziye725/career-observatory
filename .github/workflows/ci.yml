name: Verify framework
on:
  push:
    paths-ignore: ['automation/runs/**']
  pull_request:
    paths-ignore: ['automation/runs/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check:repository
